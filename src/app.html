<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111212" />

    <!-- Meta Pixel Code -->
    <script>
      // Keep local previews and automated QA out of Meta's learning signal.
      const isVanguardProductionHost =
        window.location.hostname === 'vanguardos.co' ||
        window.location.hostname === 'www.vanguardos.co';

      if (isVanguardProductionHost) {
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '915468030842339');
        fbq('track', 'PageView');

        // ViewContent fires once per production page load. Purchase remains
        // server-side only. InitiateCheckout fires only on checkout intent.
        fbq('track', 'ViewContent', {
          content_name: 'The Vanguard Launchpad',
          content_type: 'product',
          content_ids: ['lgaxz'],
          value: 129,
          currency: 'USD'
        });

        document.addEventListener('click', function(e) {
          const link = e.target.closest('a[href*="gumroad.com"]');
          if (link && typeof fbq === 'function') {
            fbq('track', 'InitiateCheckout', {
              content_name: 'The Vanguard Launchpad',
              content_type: 'product',
              content_ids: ['lgaxz'],
              value: 129,
              currency: 'USD'
            });
            fbq('trackCustom', 'CheckoutClick', {
              content_name: 'The Vanguard Launchpad',
              destination: 'gumroad'
            });
          }
        }, true);
      }
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=915468030842339&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <!-- Primary SEO -->
    <title>Build and Launch Your Digital Product in 5 Days · VanguardOS</title>
    <meta name="description" content="The Vanguard Launchpad is an interactive five-day system that guides you from idea to a branded digital product, a live sales page, a working checkout, and a ready-to-connect follow-up email sequence." />

    <meta name="author" content="VanguardOS" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://vanguardos.co/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VanguardOS" />
    <meta property="og:title" content="Build and Launch Your Digital Product in 5 Days · VanguardOS" />
    <meta property="og:description" content="The Vanguard Launchpad is an interactive five-day system that guides you from idea to a branded digital product, a live sales page, a working checkout, and a ready-to-connect follow-up email sequence." />
    <meta property="og:url" content="https://vanguardos.co/" />
    <meta property="og:image" content="https://vanguardos.co/og/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Vanguard Launchpad · 5-day system for solopreneurs" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="The Vanguard Launchpad is an interactive five-day system that guides you from idea to a branded digital product, a live sales page, a working checkout, and a ready-to-connect follow-up email sequence." />
    <meta name="twitter:image" content="https://vanguardos.co/og/og-card.jpg" />
    <meta name="twitter:image:alt" content="The Vanguard Launchpad · 5-day system for solopreneurs" />

    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/brand/brand-mark-owl.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    %sveltekit.head%
  </head>
